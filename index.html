<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
    font-family:'Poppins',sans-serif;
    position:relative;
}

/* Glow */

.glow{
    position:absolute;
    width:500px;
    height:500px;
    background:#ff4d8d;
    border-radius:50%;
    filter:blur(180px);
    opacity:0.25;
    animation:move 8s infinite alternate;
}

@keyframes move{
    from{
        transform:translate(-100px,-50px);
    }
    to{
        transform:translate(120px,100px);
    }
}

/* Card */

.card{
    width:90%;
    max-width:760px;
    padding:40px 30px;
    border-radius:30px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 0 35px rgba(255,255,255,0.08);
    text-align:center;
    color:white;
    z-index:2;
    animation:fade 2s ease;
}

h1{
    font-size:65px;
    font-family:'Great Vibes',cursive;
    color:#ffb3d1;
    margin-bottom:10px;
}

.name{
    font-size:34px;
    font-weight:600;
    margin-bottom:25px;
}

.message{
    font-size:18px;
    line-height:1.9;
    color:#f8fafc;
}

button{
    padding:14px 32px;
    border:none;
    border-radius:50px;
    font-size:18px;
    cursor:pointer;
    transition:0.4s;
    font-weight:600;
}

/* Main Button */

.main-btn{
    margin-top:35px;
    background:linear-gradient(135deg,#ff4d8d,#ff7eb3);
    color:white;
}

.main-btn:hover{
    transform:scale(1.08);
    box-shadow:0 0 25px #ff4d8d;
}

/* Proposal Section */

#proposal{
    display:none;
    margin-top:35px;
    animation:zoom 1s ease;
}

.proposal-text{
    font-size:30px;
    color:#ffc2d1;
    margin-bottom:20px;
    font-weight:700;
}

.btns{
    margin-top:25px;
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.yes-btn{
    background:#22c55e;
    color:white;
}

.yes-btn:hover{
    transform:scale(1.1);
}

.no-btn{
    background:#ef4444;
    color:white;
    position:relative;
}

#result{
    margin-top:25px;
    font-size:24px;
    color:#ffd1dc;
    display:none;
}

/* Hearts */

.heart{
    position:absolute;
    color:#ff7aa2;
    animation:float 5s linear infinite;
}

@keyframes float{
    0%{
        transform:translateY(100vh) scale(0);
        opacity:1;
    }
    100%{
        transform:translateY(-10vh) scale(1.5);
        opacity:0;
    }
}

/* Animations */

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes zoom{
    from{
        opacity:0;
        transform:scale(0.5);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* Mobile */

@media(max-width:768px){

h1{
    font-size:48px;
}

.name{
    font-size:28px;
}

.message{
    font-size:16px;
}

.proposal-text{
    font-size:24px;
}

}

</style>
</head>

<body>

<div class="glow"></div>

<div class="card">

    <h1>Happy Birthday</h1>

    <div class="name">
        Anushika Ji ❤️
    </div>

    <div class="message">

        26 May ✨<br><br>

        Tumhari smile sach me bahut special hai 💖<br><br>

        Pata nahi kab tum meri favourite person ban gayi...
        But ab bas ek baat kehni hai ❤️

    </div>

    <button class="main-btn" onclick="showProposal()">
        Open Surprise 🎁
    </button>

    <div id="proposal">

        <div class="proposal-text">
            Will You Be My GF? ❤️
        </div>

        <div class="btns">

            <button class="yes-btn" onclick="accepted()">
                Yes 💖
            </button>

            <button class="no-btn" id="noBtn">
                No 😅
            </button>

        </div>

        <div id="result">
            Yayyyyy ❤️✨<br>
            You Made My Day 🌸
        </div>

    </div>

</div>

<script>

/* Show Proposal */

function showProposal(){
    document.getElementById("proposal").style.display="block";
}

/* Yes Button */

function accepted(){
    document.getElementById("result").style.display="block";
}

/* No Button Run Away */

const noBtn=document.getElementById("noBtn");

noBtn.addEventListener("mouseover",()=>{

    const x=Math.floor(Math.random()*300)-150;
    const y=Math.floor(Math.random()*200)-100;

    noBtn.style.transform=`translate(${x}px,${y}px)`;
});

/* Floating Hearts */

function createHeart(){

    const heart=document.createElement("div");

    heart.classList.add("heart");
    heart.innerHTML="❤";

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(Math.random()*20+15)+"px";
    heart.style.animationDuration=(Math.random()*3+3)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },5000);
}

setInterval(createHeart,300);

</script>

</body>
</html>
